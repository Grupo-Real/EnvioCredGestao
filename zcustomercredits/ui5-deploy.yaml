
specVersion: "4.0"
metadata:
  name: br.com.rmp.zcustomercredits
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DEV_BAS
          url: http://ds4.greal.com.br:443
          client: '110'
        app:
          name: ZCUSTOMERCREDIT
          description: Aplicação Fiori transferência/envio crédito clientes GESTÃO
          package: ZPFI_CRED
          transport: DS4K921982
        exclude:
          - /test/
          - /localService/
